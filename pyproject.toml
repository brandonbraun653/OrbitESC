[project]
name = "OrbitESC"
version = "0.1.0"
description = "Brushless motor controller development environment"
authors = [
    {name = "Brandon Braun", email = "brandonbraun653@protonmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cobs>=1.2.1,<2.0.0",
    "python-can>=4.2.2,<5.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "numpy>=1.23.4,<2.0.0",
    "pyserial>=3.5,<4.0",
    "pytest>=7.1.2,<8.0.0",
    "loguru>=0.7.2,<1.0.0",
    "nanopb>=0.4.7,<1.0.0",
    "pyqtgraph>=0.13.3,<1.0.0",
    "pyudev>=0.24.1,<1.0.0",
    "pytest-profiling>=1.7.0,<2.0.0",
    "sip>=6.8.0,<7.0.0",
    "astropy>=6.0.0,<7.0.0",
    "h5py>=3.10.0,<4.0.0",
    "tomli>=2.0.1,<3.0.0",
    "iminuit>=2.24.0,<3.0.0",
    "matplotlib>=3.8.2,<4.0.0",
    "scipy>=1.13.0,<2.0.0",
    "scikit-dsp-comm>=2.0.3,<3.0.0",
    "pandas>=2.2.2,<3.0.0",
    "black>=23.0.0,<24.0.0",
    "flake8>=6.0.0,<7.0.0",
    "grpcio-tools",
    "mypy",
    "mypy-protobuf",
    "protobuf==5.29.5", # nanopb 0.4.9.1 requires this
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyorbit*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["pyorbit/tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".tox",
    ".eggs",
    "*.egg",
]
